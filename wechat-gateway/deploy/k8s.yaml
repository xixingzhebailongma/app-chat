# Deployment for wechat-gateway (design doc 十 "Secret 只放 K8s Secret").
#
# Real secrets live ONLY in the Secret below (values are placeholders here —
# fill them via `kubectl create secret` or a sealed-secret in CI). The app reads
# them through env vars (INTERNAL_TOKEN, JWT_SECRET, WECHAT_SECRET,
# WECHAT_OA_SECRET); config/config.json keeps dev-only placeholder values.
apiVersion: v1
kind: Secret
metadata:
  name: wechat-gateway-secrets
type: Opaque
stringData:
  INTERNAL_TOKEN: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  # WeChat miniapp (jscode2session + subscribe-message access_token).
  WECHAT_APPID: "CHANGE_ME"
  WECHAT_SECRET: "CHANGE_ME"
  # WeChat OA (公众号) access_token.
  WECHAT_OA_APPID: "CHANGE_ME"
  WECHAT_OA_SECRET: "CHANGE_ME"
  # OA 到校通知模板 ID（经微信审核后注入；空则回落 config 占位符、渠道短路 mock）。
  WECHAT_OA_TMPL_ARRIVAL: "CHANGE_ME"
  # 短信服务商凭证（阿里云 Dysmsapi 或腾讯云 SMS；provider 由 config 选择）。
  SMS_ACCESS_KEY: "CHANGE_ME"
  SMS_SECRET: "CHANGE_ME"
  # Redis AUTH password (empty for a passwordless dev Redis).
  REDIS_PASSWORD: "CHANGE_ME"
  # PostgreSQL (design doc 14). POSTGRES_* seed the self-hosted StatefulSet
  # below; PG_CONNINFO is the libpq connection string the gateway reads.
  # "Pluggable": to use a managed/external PG, replace PG_CONNINFO with its
  # conninfo and drop the self-hosted StatefulSet/Service — the app only reads
  # PG_CONNINFO. Keep PG_CONNINFO's password in sync with POSTGRES_PASSWORD.
  POSTGRES_USER: "gateway"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "gateway"
  PG_CONNINFO: "host=postgres port=5432 dbname=gateway user=gateway password=CHANGE_ME sslmode=disable"
---
# Migrations ConfigMap (design doc 14). The gateway's migrate initContainer
# mounts these migration files and applies them in order. Create it from the repo
# (keeps sql/ the single source of truth):
#   kubectl create configmap wechat-gateway-migrations \
#     --from-file=sql/migration_v1.sql \
#     --from-file=sql/migration_v2.sql \
#     --from-file=sql/migration_v3.sql \
#     --from-file=sql/migration_v4.sql \
#     --from-file=sql/migration_v5.sql \
#     --from-file=sql/migration_v6.sql \
#     --from-file=sql/migration_v7.sql \
#     --from-file=sql/migration_v8.sql \
#     --from-file=sql/migration_v9.sql \
#     --from-file=sql/migration_v10.sql \
#     --from-file=sql/migration_v11.sql \
#     --from-file=sql/migration_v12.sql \
#     --from-file=sql/migration_v13.sql \
#     --from-file=sql/migration_v14.sql \
#     -o yaml --dry-run=client | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wechat-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wechat-gateway
  template:
    metadata:
      labels:
        app: wechat-gateway
    spec:
      initContainers:
        # Apply schema migrations before the gateway starts (design doc 14).
        # SQL files are mounted from the wechat-gateway-migrations ConfigMap —
        # create it once from the repo: see the note above the Deployment.
        - name: migrate
          image: postgres:16
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -p 5432; do sleep 2; done
              psql "$PG_CONNINFO" \
                -f /migrations/migration_v1.sql \
                -f /migrations/migration_v2.sql \
                -f /migrations/migration_v3.sql \
                -f /migrations/migration_v4.sql \
                -f /migrations/migration_v5.sql \
                -f /migrations/migration_v6.sql \
                -f /migrations/migration_v7.sql \
                -f /migrations/migration_v8.sql \
                -f /migrations/migration_v9.sql \
                -f /migrations/migration_v10.sql \
                -f /migrations/migration_v11.sql \
                -f /migrations/migration_v12.sql \
                -f /migrations/migration_v13.sql \
                -f /migrations/migration_v14.sql
          env:
            - name: PG_CONNINFO
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: PG_CONNINFO
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      containers:
        - name: wechat-gateway
          image: wechat-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: INTERNAL_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: JWT_SECRET
            - name: WECHAT_APPID
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: WECHAT_APPID
            - name: WECHAT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: WECHAT_SECRET
            - name: WECHAT_OA_APPID
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: WECHAT_OA_APPID
            - name: WECHAT_OA_SECRET
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: WECHAT_OA_SECRET
            - name: WECHAT_OA_TMPL_ARRIVAL
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: WECHAT_OA_TMPL_ARRIVAL
            - name: SMS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: SMS_ACCESS_KEY
            - name: SMS_SECRET
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: SMS_SECRET
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: REDIS_PASSWORD
            - name: APP_ENV
              value: "prod"
            - name: PG_CONNINFO
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: PG_CONNINFO
          resources: {}
      volumes:
        - name: migrations
          configMap:
            name: wechat-gateway-migrations
---
# Redis for the token cache + refresh lock (design doc 十). Single replica is
# enough for a dev/CI cluster; use a managed Redis (or Sentinel/Cluster) in prod.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # AUTH requires the gateway's REDIS_PASSWORD to match. For a
          # passwordless dev Redis, drop this command + the REDIS_PASSWORD env.
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: wechat-gateway
spec:
  selector:
    app: wechat-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# Self-hosted PostgreSQL (design doc 14). StatefulSet + PVC so data survives
# pod restarts. For a managed/external PG, drop this StatefulSet + Service and
# point PG_CONNINFO in the Secret at it — the app is agnostic to where PG lives.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: wechat-gateway-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
